name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: make test (gofmt, check-config, entrypoint test, vet, go test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27" # keep in sync with GATEWAY_GO_VERSION and go.mod
          cache: false # no dependencies and no go.sum, so there is nothing to cache
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install PyYAML (check-config dependency)
        run: pip install pyyaml
      - name: make test
        run: make test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile pins MOSDNS_COMMIT and every base-image digest; the
      # build fails loudly if the v4.5.3 tag ever moves. No GATEWAY_VERSION
      # build-arg: like Koyeb, CI takes the version from the VERSION file.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mosdns-koyeb-doh-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
