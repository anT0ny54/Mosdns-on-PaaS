# Keeps the digest-pinned base images (Dockerfile) and the GitHub Actions
# versions current. The Dockerfile FROM lines are literal (tag + digest) on
# purpose: Dependabot cannot read ARG-templated FROM lines.
#
# golang: only digest refreshes and patch releases are proposed.
# - The MosDNS builder must stay on Go 1.19 (MosDNS v4 does not build on newer
#   Go), so minor/major bumps of golang:1.19.13-bookworm must never be offered.
# - A gateway Go minor bump (golang:1.27 -> 1.28) also needs go.mod and
#   ci.yml go-version changed in the same commit (check-config.sh fails
#   otherwise), so it is done by hand rather than by a Dependabot PR.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
