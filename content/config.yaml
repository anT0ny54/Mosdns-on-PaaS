log:
  level: warn

# MosDNS v5.3.4 configuration.
# Public HTTP/DoH ingress is handled by the small Go proxy. MosDNS itself
# listens only on loopback, so plain DNS is never exposed publicly.
plugins:
  - tag: cache
    type: cache
    args:
      size: __CACHE_SIZE__
      lazy_cache_ttl: 43200
      dump_file: __CACHE_DUMP_FILE__
      dump_interval: __CACHE_DUMP_INTERVAL__

  - tag: upstream_0
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: __UPSTREAM_0__
          dial_addr: __UPSTREAM_0_IP__
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__

  - tag: upstream_1
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: __UPSTREAM_1__
          dial_addr: __UPSTREAM_1_IP__
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__

  - tag: upstream_2
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: __UPSTREAM_2__
          dial_addr: __UPSTREAM_2_IP__
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__

  # Sequential fallback keeps CPU/network use low on the 0.1-vCPU tier.
  - tag: fallback_1
    type: fallback
    args:
      primary: upstream_0
      secondary: upstream_1
      threshold: 350
      always_standby: false

  - tag: fallback_2
    type: fallback
    args:
      primary: fallback_1
      secondary: upstream_2
      threshold: 350
      always_standby: false

  - tag: main
    type: sequence
    args:
      exec:
        - cache
        - matches: has_resp
          exec: accept
        - fallback_2
        - _return

  - tag: doh_server
    type: http_server
    args:
      entries:
        - path: __DOH_PATH__
          exec: main
      src_ip_header: X-Forwarded-For
      listen: 127.0.0.1:__MOSDNS_BACKEND_PORT__
      idle_timeout: __DOH_IDLE_TIMEOUT__
