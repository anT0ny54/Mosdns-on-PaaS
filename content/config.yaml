log:
  level: warn

plugins:
  # Public DoH abuse protection. This is rate limiting, not authentication.
  - tag: client_limit
    type: client_limiter
    args:
      max_qps: 20
      v4_mask: 32
      v6_mask: 48

  # Custom v4.5.3 cache: RAM first, with an optional disk warm snapshot.
  - tag: mem_cache
    type: cache
    args:
      size: CACHE_SIZE_PLACEHOLDER
      lazy_cache_ttl: 86400
      lazy_cache_reply_ttl: 30
      dump_file: CACHE_DUMP_FILE_PLACEHOLDER
      dump_interval: CACHE_DUMP_INTERVAL_PLACEHOLDER

  - tag: forward_upstream
    type: fast_forward
    args:
      upstream:
        - addr: https://root.hagezi.org/dns-query
          trusted: true
          enable_pipeline: true
        - addr: https://wurzn.hagezi.org/dns-query
          trusted: true
          enable_pipeline: true
        - addr: https://juuri.hagezi.org/dns-query
          trusted: true
          enable_pipeline: true

  - tag: forward
    type: sequence
    args:
      exec:
        - client_limit
        - _misc_optm
        - mem_cache
        - forward_upstream
        - _return

servers:
  - exec: forward
    timeout: 5
    listeners:
      - protocol: http
        addr: ":PORT_PLACEHOLDER"
        url_path: "PATH_PLACEHOLDER"
        get_user_ip_from_header: "X-Forwarded-For"
