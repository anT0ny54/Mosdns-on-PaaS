log:
  level: warn

# Public listener is handled by the small Go front-end. MosDNS only listens
# on loopback, so plain DNS is never exposed by this service.
plugins:
  - tag: cache
    type: cache
    args:
      size: __CACHE_SIZE__
      lazy_cache_ttl: 43200
      dump_file: __CACHE_DUMP_FILE__
      dump_interval: __CACHE_DUMP_INTERVAL__

  - tag: upstream_0
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: __UPSTREAM_0__
          dial_addr: __UPSTREAM_0_IP__
          trusted: true
          enable_pipeline: true
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__

  - tag: upstream_1
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: __UPSTREAM_1__
          dial_addr: __UPSTREAM_1_IP__
          trusted: true
          enable_pipeline: true
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__

  - tag: upstream_2
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: __UPSTREAM_2__
          dial_addr: __UPSTREAM_2_IP__
          trusted: true
          enable_pipeline: true
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__

  - tag: fallback_1
    type: fallback
    args:
      primary: upstream_0
      secondary: upstream_1
      threshold: 350
      always_standby: false

  - tag: fallback_2
    type: fallback
    args:
      primary: fallback_1
      secondary: upstream_2
      threshold: 350
      always_standby: false

  - tag: main
    type: sequence
    args:
      exec:
        - cache
        - fallback_2
        - _return

servers:
  - exec: main
    timeout: __SERVER_TIMEOUT__
    listeners:
      - protocol: http
        addr: "127.0.0.1:__MOSDNS_BACKEND_PORT__"
        idle_timeout: __DOH_IDLE_TIMEOUT__
        url_path: "__DOH_PATH__"
        get_user_ip_from_header: "X-Forwarded-For"
