log:
  level: warn

plugins:
  - tag: client_limit
    type: client_limiter
    args:
      max_qps: MAX_QPS_PLACEHOLDER
      v4_mask: 32
      v6_mask: 48

  # Hot RAM cache plus bounded warm-start snapshot.
  - tag: mem_cache
    type: cache
    args:
      size: CACHE_SIZE_PLACEHOLDER
      lazy_cache_ttl: 86400
      lazy_cache_reply_ttl: 30
      dump_file: CACHE_DUMP_FILE_PLACEHOLDER
      dump_interval: CACHE_DUMP_INTERVAL_PLACEHOLDER

  # Three ordered upstream slots. The entrypoint rewrites their order so the
  # selected upstream is always tried first, followed by the other two.
  - tag: upstream_0
    type: fast_forward
    args:
      upstream:
        - addr: UPSTREAM_0_PLACEHOLDER
          trusted: true
          enable_pipeline: true

  - tag: upstream_1
    type: fast_forward
    args:
      upstream:
        - addr: UPSTREAM_1_PLACEHOLDER
          trusted: true
          enable_pipeline: true

  - tag: upstream_2
    type: fast_forward
    args:
      upstream:
        - addr: UPSTREAM_2_PLACEHOLDER
          trusted: true
          enable_pipeline: true

  # Sequential failover:
  #   1) upstream_0
  #   2) upstream_1 if #1 fails
  #   3) upstream_2 if #2 fails
  #
  # fast_fallback=1 makes the secondary start only after the primary fails
  # (or after a 1 ms fallback threshold), rather than racing both upstreams.
  - tag: sequential_failover
    type: sequence
    args:
      exec:
        - primary:
            - upstream_0
          secondary:
            - primary:
                - upstream_1
              secondary:
                - upstream_2
              fast_fallback: 1
              always_standby: false
          fast_fallback: 1
          always_standby: false

  - tag: forward
    type: sequence
    args:
      exec:
        - client_limit
        - _misc_optm
        - mem_cache
        - sequential_failover
        - _return

servers:
  - exec: forward
    timeout: 3
    listeners:
      - protocol: http
        addr: ":PORT_PLACEHOLDER"
        url_path: "PATH_PLACEHOLDER"
        get_user_ip_from_header: "X-Forwarded-For"
