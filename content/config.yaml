log:
  level: warn

plugins:
  # Public-resolver abuse guard. This is intentionally a per-client limit,
  # not authentication: the DoH endpoint remains fully public.
  # It protects the tiny Koyeb instance from accidental/bursty overuse.
  # It is NOT DDoS protection.
  - tag: rate_limit
    type: rate_limiter
    args:
      qps: 20
      burst: 40
      mask4: 32
      mask6: 48

  - tag: mem_cache
    type: cache
    args:
      size: CACHE_SIZE_PLACEHOLDER
      lazy_cache_ttl: 86400
      lazy_cache_reply_ttl: 30
      dump_file: CACHE_DUMP_FILE_PLACEHOLDER
      dump_interval: CACHE_DUMP_INTERVAL_PLACEHOLDER

  - tag: forward_upstream
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: https://root.hagezi.org/dns-query
          enable_pipeline: true
        - addr: https://wurzn.hagezi.org/dns-query
          enable_pipeline: true
        - addr: https://juuri.hagezi.org/dns-query
          enable_pipeline: true

  - tag: forward
    type: sequence
    args:
      - matches: "!$rate_limit"
        exec: reject 3
      - exec: _misc_optm
      - exec: $mem_cache
      - matches: has_resp
        exec: _return
      - exec: $forward_upstream
      - exec: _return

servers:
  - exec: forward
    timeout: 5
    listeners:
      - protocol: http
        addr: ":PORT_PLACEHOLDER"
        url_path: "PATH_PLACEHOLDER"
        get_user_ip_from_header: "X-Forwarded-For"
