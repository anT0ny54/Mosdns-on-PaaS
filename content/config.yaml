log:
  level: warn

plugins:
  # Per-client limiter. This protects the public DoH endpoint without adding
  # another resident process or large state table.
  - tag: client_limit
    type: client_limiter
    args:
      max_qps: MAX_QPS_PLACEHOLDER
      v4_mask: 32
      v6_mask: 48

  # Hot RAM cache + bounded warm-start snapshot. The disk copy is an
  # optimization for graceful rotations/restarts; DNS operation never
  # depends on it.
  - tag: mem_cache
    type: cache
    args:
      size: CACHE_SIZE_PLACEHOLDER
      lazy_cache_ttl: 86400
      lazy_cache_reply_ttl: 30
      dump_file: CACHE_DUMP_FILE_PLACEHOLDER
      dump_interval: CACHE_DUMP_INTERVAL_PLACEHOLDER

  # Exactly one upstream is active at a time. The supervisor changes this
  # endpoint on rotation so every query uses only the selected resolver.
  - tag: forward_upstream
    type: fast_forward
    args:
      upstream:
        - addr: HAGEZI_UPSTREAM_PLACEHOLDER
          trusted: true
          enable_pipeline: true

  - tag: forward
    type: sequence
    args:
      exec:
        - client_limit
        - _misc_optm
        - mem_cache
        - forward_upstream
        - _return

servers:
  - exec: forward
    timeout: 3
    listeners:
      - protocol: http
        addr: ":PORT_PLACEHOLDER"
        url_path: "PATH_PLACEHOLDER"
        get_user_ip_from_header: "X-Forwarded-For"
