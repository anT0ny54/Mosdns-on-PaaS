log:
  level: warn

# Public DoH only. No UDP/TCP DNS listener is exposed.
plugins:
  # Larger bounded hot cache plus bounded disk-backed warm-start copy.
  - tag: mem_cache
    type: cache
    args:
      size: __CACHE_SIZE__
      lazy_cache_ttl: 43200
      lazy_cache_reply_ttl: 20
      cache_everything: true
      dump_file: __CACHE_DUMP_FILE__
      dump_interval: __CACHE_DUMP_INTERVAL__

  # True ordered failover: one upstream is contacted at a time, and the next
  # upstream is used on the same query only when the previous exchange fails.
  # This avoids the parallel behavior of fast_forward and avoids the v4.5.3
  # fallback-node semantics, which otherwise do not provide immediate
  # sequential retry when fast_fallback/stat tracking are disabled.
  - tag: sequential_failover
    type: sequential_forward
    args:
      upstream:
        - addr: __UPSTREAM_0__
          dial_addr: __UPSTREAM_0_IP__
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__
          max_conns: __UPSTREAM_MAX_CONNS__

        - addr: __UPSTREAM_1__
          dial_addr: __UPSTREAM_1_IP__
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__
          max_conns: __UPSTREAM_MAX_CONNS__

        - addr: __UPSTREAM_2__
          dial_addr: __UPSTREAM_2_IP__
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__
          max_conns: __UPSTREAM_MAX_CONNS__

        # Independent last-resort resolver. This is intentionally outside the
        # three HaGeZi candidates: normal health ordering never selects it, but
        # sequential_failover can use it after all three policy upstreams fail.
        - addr: __EMERGENCY_UPSTREAM__
          dial_addr: __EMERGENCY_UPSTREAM_IP__
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__
          max_conns: 1

  - tag: forward
    type: sequence
    args:
      exec:
        - _misc_optm
        - mem_cache
        - sequential_failover
        - _return

servers:
  - exec: forward
    timeout: __SERVER_TIMEOUT__
    listeners:
      - protocol: http
        addr: "127.0.0.1:__MOSDNS_BACKEND_PORT__"
        idle_timeout: __DOH_IDLE_TIMEOUT__
        url_path: __DOH_PATH__
        get_user_ip_from_header: "X-Forwarded-For"
