# MosDNS v5.3.4 - Koyeb optimized DoH forwarder
# No GeoIP/Geosite data is required.

log:
  level: warn

plugins:
  # In-memory DNS cache. 40960 entries is a good balance for a small Koyeb instance.
  - tag: cache
    type: cache
    args:
      size: 40960
      lazy_cache_ttl: 259200

  # Three Hagezi DoH upstreams. All are trusted and use connection pipelining.
  - tag: hagezi
    type: fast_forward
    args:
      upstream:
        - addr: https://root.hagezi.org/dns-query
          trusted: true
          enable_pipeline: true
        - addr: https://wurzn.hagezi.org/dns-query
          trusted: true
          enable_pipeline: true
        - addr: https://juuri.hagezi.org/dns-query
          trusted: true
          enable_pipeline: true

  # Main request pipeline.
  - tag: main
    type: sequence
    args:
      - exec: cache
      - matches:
          - has_resp
        exec: accept
      - exec: $hagezi

  # Koyeb exposes the HTTP port and supplies PORT automatically.
  - tag: doh
    type: http_server
    args:
      entries:
        - path: /dns-query
          exec: $main
      src_ip_header: X-Forwarded-For
      listen: 0.0.0.0:8080
      idle_timeout: 30
