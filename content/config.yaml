log:
  level: warn

# v7.4 LEAK-RESISTANT POLICY:
# There is intentionally NO plain UDP/TCP DNS listener.
# All recursive queries leave MosDNS only through HTTPS DoH upstreams.

plugins:
  - tag: client_limit
    type: client_limiter
    args:
      max_qps: __MAX_QPS__
      v4_mask: 32
      v6_mask: 48

  # Bounded hot cache. 4096 is a safer default for 512 MiB/0.1 vCPU;
  # increase only after measuring hit rate and memory.
  - tag: mem_cache
    type: cache
    args:
      size: __CACHE_SIZE__
      lazy_cache_ttl: 43200
      lazy_cache_reply_ttl: 20
      dump_file: __CACHE_DUMP_FILE__
      dump_interval: __CACHE_DUMP_INTERVAL__

  - tag: upstream_0
    type: fast_forward
    args:
      upstream:
        - addr: __UPSTREAM_0__
          trusted: true
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__
          enable_pipeline: true
          max_conns: 1

  - tag: upstream_1
    type: fast_forward
    args:
      upstream:
        - addr: __UPSTREAM_1__
          trusted: true
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__
          enable_pipeline: true
          max_conns: 1

  - tag: upstream_2
    type: fast_forward
    args:
      upstream:
        - addr: __UPSTREAM_2__
          trusted: true
          idle_timeout: __UPSTREAM_IDLE_TIMEOUT__
          enable_pipeline: true
          max_conns: 1

  # Strictly sequential failover. No parallel upstream fan-out on the hot path.
  - tag: sequential_failover
    type: sequence
    args:
      exec:
        - primary:
            - upstream_0
          secondary:
            - primary:
                - upstream_1
              secondary:
                - upstream_2
              fast_fallback: 0
              always_standby: false
          fast_fallback: 0
          always_standby: false

  - tag: forward
    type: sequence
    args:
      exec:
        - client_limit
        - _misc_optm
        - mem_cache
        - sequential_failover
        - _return

servers:
  - exec: forward
    timeout: __SERVER_TIMEOUT__
    listeners:
      - protocol: http
        addr: "127.0.0.1:__MOSDNS_BACKEND_PORT__"
        url_path: "__DOH_PATH__"
        get_user_ip_from_header: "X-Forwarded-For"
