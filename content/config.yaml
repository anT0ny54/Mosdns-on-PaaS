log:
  level: warn

plugins:
  - tag: client_limit
    type: client_limiter
    args:
      max_qps: MAX_QPS_PLACEHOLDER
      v4_mask: 32
      v6_mask: 48

  # Bounded hot cache. 4096 is a safer default for 512 MiB/0.1 vCPU;
  # increase only after measuring hit rate and memory.
  - tag: mem_cache
    type: cache
    args:
      size: CACHE_SIZE_PLACEHOLDER
      lazy_cache_ttl: 43200
      lazy_cache_reply_ttl: 20
      dump_file: CACHE_DUMP_FILE_PLACEHOLDER
      dump_interval: CACHE_DUMP_INTERVAL_PLACEHOLDER

  - tag: upstream_0
    type: fast_forward
    args:
      upstream:
        - addr: UPSTREAM_0_PLACEHOLDER
          trusted: true
          idle_timeout: UPSTREAM_IDLE_TIMEOUT_PLACEHOLDER
          enable_pipeline: true
          max_conns: 1

  - tag: upstream_1
    type: fast_forward
    args:
      upstream:
        - addr: UPSTREAM_1_PLACEHOLDER
          trusted: true
          idle_timeout: UPSTREAM_IDLE_TIMEOUT_PLACEHOLDER
          enable_pipeline: true
          max_conns: 1

  - tag: upstream_2
    type: fast_forward
    args:
      upstream:
        - addr: UPSTREAM_2_PLACEHOLDER
          trusted: true
          idle_timeout: UPSTREAM_IDLE_TIMEOUT_PLACEHOLDER
          enable_pipeline: true
          max_conns: 1

  # Strictly sequential failover. No parallel upstream fan-out on the hot path.
  - tag: sequential_failover
    type: sequence
    args:
      exec:
        - primary:
            - upstream_0
          secondary:
            - primary:
                - upstream_1
              secondary:
                - upstream_2
              fast_fallback: 0
              always_standby: false
          fast_fallback: 0
          always_standby: false

  - tag: forward
    type: sequence
    args:
      exec:
        - client_limit
        - _misc_optm
        - mem_cache
        - sequential_failover
        - _return

servers:
  - exec: forward
    timeout: SERVER_TIMEOUT_PLACEHOLDER
    listeners:
      - protocol: http
        addr: "127.0.0.1:BACKEND_PORT_PLACEHOLDER"
        url_path: "PATH_PLACEHOLDER"
        get_user_ip_from_header: "X-Forwarded-For"
