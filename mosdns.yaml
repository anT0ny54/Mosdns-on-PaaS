# MosDNS v4.5.3
# Primary: race HaGeZiDNS1 + HaGeZiDNS2 and use the first response.
# Fallback: use HaGeZiDNS3 if the primary path has not responded within 5 seconds.

log:
  level: warn
  file: ""

plugins:
  - tag: cache
    type: cache
    args:
      size: 4096
      lazy_cache_ttl: 3600
      lazy_cache_reply_ttl: 15
      cache_everything: false

  # Primary: fast_forward sends to both upstreams concurrently.
  - tag: primary_fast
    type: fast_forward
    args:
      upstream:
        - addr: "https://root.hagezi.org/dns-query"
          dial_addr: "188.34.161.210"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2
        - addr: "https://wurzn.hagezi.org/dns-query"
          dial_addr: "159.69.155.94"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2

  # Secondary: standby fallback endpoint.
  - tag: fallback_hagezi
    type: fast_forward
    args:
      upstream:
        - addr: "https://juuri.hagezi.org/dns-query"
          dial_addr: "95.217.163.17"
          enable_pipeline: true
          idle_timeout: 30
          max_conns: 1

  # v4.5.3 sequence syntax.
  # NOTE: "matches:" (not "if:") is required to use the built-in has_resp
  # quick-setup matcher without defining it as a separate plugin. "if:" only
  # accepts a reference to an already-defined plugin tag, which is why
  # "if: has_resp" failed with "cannot find matcher has_resp".
  # The primary/secondary/fast_fallback block below is a valid inline
  # fallback node embedded directly in the sequence (not a plugin type).
  - tag: main_sequence
    type: sequence
    args:
      exec:
        - cache
        - matches: has_resp
          exec:
            - _return
        - primary:
            - primary_fast
          secondary:
            - fallback_hagezi
          fast_fallback: 5000
          always_standby: false

  # v4.5.3 server configuration.
  # NOTE: mosdns v4.5.3 does not support the top-level "servers:" shortcut
  # section used in newer versions. The listener must be defined as an
  # explicit plugin of type "http_server", which is what was missing and
  # caused "plugin type http_server not defined".
  - tag: http_server
    type: http_server
    args:
      entries:
        - path: "/dns-query"
          exec: main_sequence
      listen: "127.0.0.1:8081"
      src_ip_header: "X-Forwarded-For"
      idle_timeout: 30
      
