# MosDNS v4.5.3
# Primary: race HaGeZiDNS1 + HaGeZiDNS2 and use the first response.
# Fallback: use HaGeZiDNS3 when the primary path fails or exceeds 5 seconds.

log:
  level: warn
  file: ""

plugins:
  - tag: cache
    type: cache
    args:
      size: 4096
      lazy_cache_ttl: 3600
      lazy_cache_reply_ttl: 15
      cache_everything: false

  - tag: primary_fast
    type: fast_forward
    args:
      upstream:
        - addr: "https://root.hagezi.org/dns-query"
          dial_addr: "188.34.161.210"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2
        - addr: "https://wurzn.hagezi.org/dns-query"
          dial_addr: "159.69.155.94"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2

  - tag: fallback_hagezi
    type: fast_forward
    args:
      upstream:
        - addr: "https://juuri.hagezi.org/dns-query"
          dial_addr: "95.217.163.17"
          enable_pipeline: true
          idle_timeout: 30
          max_conns: 1

  # MosDNS v4 fallback plugin.
  - tag: dns_fallback
    type: fallback
    args:
      primary: primary_fast
      secondary: fallback_hagezi
      threshold: 5000
      always_standby: false

  # MosDNS v4 sequence syntax: matches + exec.
  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache
      - matches: has_resp
        exec: accept
      - exec: $dns_fallback

  # MosDNS v4 HTTP DoH server used by doh-gateway.
  - tag: doh_server
    type: http_server
    args:
      entries:
        - path: "/dns-query"
          exec: main_sequence
      src_ip_header: "X-Forwarded-For"
      listen: "127.0.0.1:8081"
      idle_timeout: 10
      
