# MosDNS v4.5.3
# Primary: race two HaGeZi DoH endpoints and use the first response.
# Fallback: use the standby HaGeZi endpoint after 400 ms.

log:
  level: error
  file: ""

plugins:
  - tag: cache
    type: cache
    args:
      size: 32768
      lazy_cache_ttl: 3600
      lazy_cache_reply_ttl: 30
      cache_everything: false
      when_hit: _return

  - tag: primary_fast
    type: fast_forward
    args:
      upstream:
        - addr: "https://root.hagezi.org/dns-query"
          dial_addr: "188.34.161.210"
          enable_pipeline: true
          idle_timeout: 20
          max_conns: 2
        - addr: "https://wurzn.hagezi.org/dns-query"
          dial_addr: "159.69.155.94"
          enable_pipeline: true
          idle_timeout: 20
          max_conns: 2

  - tag: fallback_hagezi
    type: fast_forward
    args:
      upstream:
        - addr: "https://juuri.hagezi.org/dns-query"
          dial_addr: "95.217.163.17"
          enable_pipeline: true
          idle_timeout: 20
          max_conns: 2

  - tag: main_sequence
    type: sequence
    args:
      exec:
        - cache
        - primary:
            - primary_fast
          secondary:
            - fallback_hagezi
          fast_fallback: 400
          always_standby: false

servers:
  - exec: main_sequence
    timeout: 2
    listeners:
      - protocol: http
        addr: "127.0.0.1:8081"
        url_path: "/dns-query"
        get_user_ip_from_header: "X-Forwarded-For"
        idle_timeout: 20
