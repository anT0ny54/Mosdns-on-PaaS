# MosDNS v4.5.3
# Primary: race HaGeZiDNS1 + HaGeZiDNS2 and use the first response.
# Fallback: use HaGeZiDNS3 if the primary path has not responded within 5 seconds.

log:
  level: warn
  file: ""

plugins:
  # v4.5.3 has no "has_resp" plugin or matcher at all (that concept only
  # exists in mosdns v5). Instead, use the cache plugin's built-in
  # "when_hit" option: on a cache hit, jump straight to the pre-initialized
  # "_return" plugin, which skips the rest of this sequence (i.e. skips
  # forwarding) since we already have a response.
  - tag: cache
    type: cache
    args:
      size: 4096
      lazy_cache_ttl: 3600
      lazy_cache_reply_ttl: 15
      cache_everything: false
      when_hit: _return

  # Primary: fast_forward sends to both upstreams concurrently.
  - tag: primary_fast
    type: fast_forward
    args:
      upstream:
        - addr: "https://root.hagezi.org/dns-query"
          dial_addr: "188.34.161.210"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2
        - addr: "https://wurzn.hagezi.org/dns-query"
          dial_addr: "159.69.155.94"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2

  # Secondary: standby fallback endpoint.
  - tag: fallback_hagezi
    type: fast_forward
    args:
      upstream:
        - addr: "https://juuri.hagezi.org/dns-query"
          dial_addr: "95.217.163.17"
          enable_pipeline: true
          idle_timeout: 30
          max_conns: 1

  - tag: main_sequence
    type: sequence
    args:
      exec:
        - cache
        - primary:
            - primary_fast
          secondary:
            - fallback_hagezi
          fast_fallback: 5000
          always_standby: false

# v4.5.3 server configuration.
# NOTE: listener plugins (http_server, udp_server, etc.) are NOT a
# registrable plugin type in v4 - that's why defining one under "plugins:"
# always failed with "not defined". Listeners are handled natively via this
# top-level "servers:" block. The key is "listener:" (singular) - the
# original config used "listeners:" (plural), which was silently ignored,
# leaving the server with no listener and causing the same error.
servers:
  - exec: main_sequence
    timeout: 5
    listeners:
      - protocol: http
        addr: "127.0.0.1:8081"
        url_path: "/dns-query"
        get_user_ip_from_header: "X-Forwarded-For"
        idle_timeout: 30
        
