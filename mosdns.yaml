# MosDNS v4.5.3
# Readiness: "ready.doh-gateway.invalid A" is answered locally (never cached,
# never sent upstream), so the gateway's /readyz checks MosDNS itself and an
# upstream outage cannot make the platform restart the container.
# EDNS: every option except ECS is stripped before the cache key is built, so
# clients that send EDNS0 (padding, cookies) share cache entries.
# Primary: race two HaGeZi DoH endpoints and use the first response.
# Fallback: if the primary has not produced a usable answer within 400 ms, also
# query the standby HaGeZi endpoint and use whichever answers first.
# servers[0].timeout must stay below the gateway UPSTREAM_TIMEOUT (default 2.5s).

log:
  level: error
  file: ""

plugins:
  # Must answer the gateway's readinessProbeName (main.go); check-config.sh
  # verifies that both agree.
  - tag: readiness
    type: arbitrary
    args:
      rr:
        - "ready.doh-gateway.invalid. 0 IN A 127.0.0.1"

  - tag: cache
    type: cache
    args:
      size: 32768
      lazy_cache_ttl: 3600
      lazy_cache_reply_ttl: 30
      # MosDNS v4 only caches "simple" queries unless this is true, and an
      # EDNS0 OPT record (sent by nearly every DoH client) makes a query
      # non-simple; the EDNS filter below keeps the keys stable.
      cache_everything: true
      when_hit: _return

  - tag: primary_fast
    type: fast_forward
    args:
      upstream:
        - addr: "https://root.hagezi.org/dns-query"
          dial_addr: "188.34.161.210"
          idle_timeout: 20
          max_conns: 2
        - addr: "https://wurzn.hagezi.org/dns-query"
          dial_addr: "159.69.155.94"
          idle_timeout: 20
          max_conns: 2

  - tag: fallback_hagezi
    type: fast_forward
    args:
      upstream:
        - addr: "https://juuri.hagezi.org/dns-query"
          dial_addr: "95.217.163.17"
          idle_timeout: 20
          max_conns: 2

  - tag: main_sequence
    type: sequence
    args:
      exec:
        - readiness
        - _edns0_filter_ecs_only
        - cache
        - primary:
            - primary_fast
          secondary:
            - fallback_hagezi
          fast_fallback: 400
          always_standby: false

servers:
  - exec: main_sequence
    timeout: 2
    listeners:
      - protocol: http
        addr: "127.0.0.1:8081"
        url_path: "/dns-query"
        idle_timeout: 20
