# MosDNS v4.5.3
# Primary: race HaGeZiDNS1 + HaGeZiDNS2 and use the first response.
# Fallback: keep HaGeZiDNS3 standby and invoke it only when the primary
# path fails or remains unanswered past the 5-second threshold.
# The three dial_addr values are the supplied fixed IPv4 endpoints; the HTTPS
# hostname remains the TLS name/SNI used for certificate validation.

log:
  level: warn
  file: ""

plugins:
  # Small in-memory DNS cache sized for a 512 MiB service.
  - tag: cache
    type: cache
    args:
      size: 4096
      lazy_cache_ttl: 3600
      lazy_cache_reply_ttl: 15
      cache_everything: false

  # PRIMARY: both upstreams are queried in parallel by fast_forward.
  - tag: primary_fast
    type: fast_forward
    args:
      upstream:
        - addr: "https://root.hagezi.org/dns-query"
          dial_addr: "188.34.161.210"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2
        - addr: "https://wurzn.hagezi.org/dns-query"
          dial_addr: "159.69.155.94"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2

  # SECONDARY: standby-only fallback endpoint.
  - tag: fallback_hagezi
    type: fast_forward
    args:
      upstream:
        - addr: "https://juuri.hagezi.org/dns-query"
          dial_addr: "95.217.163.17"
          enable_pipeline: true
          idle_timeout: 30
          max_conns: 1

  # Native MosDNS fallback keeps the primary path authoritative while allowing
  # the secondary to take over after a primary failure/5-second slow response.
  # always_standby=false avoids sending every query to the fallback endpoint.
  - tag: hagezi_fallback
    type: fallback
    args:
      primary: primary_fast
      secondary: fallback_hagezi
      threshold: 5000
      always_standby: false

  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache
      - matches: has_resp
        exec: accept

      - exec: $hagezi_fallback
      - matches: has_resp
        exec: accept

  # Internal DoH endpoint consumed by the lightweight gateway.
  - tag: doh_server
    type: http_server
    args:
      entries:
        - path: "/dns-query"
          exec: main_sequence
      src_ip_header: "X-Forwarded-For"
      listen: "127.0.0.1:8081"
      idle_timeout: 10
