# MosDNS v4.5.3
# Primary: race HaGeZiDNS1 + HaGeZiDNS2 and use the first response.
# Fallback: use HaGeZiDNS3 if the primary path has not responded within 5 seconds.

log:
  level: warn
  file: ""

plugins:
  - tag: cache
    type: cache
    args:
      size: 4096
      lazy_cache_ttl: 3600
      lazy_cache_reply_ttl: 15
      cache_everything: false

  # Primary: fast_forward sends to both upstreams concurrently.
  - tag: primary_fast
    type: fast_forward
    args:
      upstream:
        - addr: "https://root.hagezi.org/dns-query"
          dial_addr: "188.34.161.210"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2
        - addr: "https://wurzn.hagezi.org/dns-query"
          dial_addr: "159.69.155.94"
          enable_pipeline: true
          idle_timeout: 60
          max_conns: 2

  # Secondary: standby fallback endpoint.
  - tag: fallback_hagezi
    type: fast_forward
    args:
      upstream:
        - addr: "https://juuri.hagezi.org/dns-query"
          dial_addr: "95.217.163.17"
          enable_pipeline: true
          idle_timeout: 30
          max_conns: 1

  # v4.5.3 sequence syntax.
  # IMPORTANT: fallback is an inline sequence operation; it is NOT a plugin type.
  # _return is the v4 sequence return command (not the v5 'accept' command).
  - tag: main_sequence
    type: sequence
    args:
      exec:
        - cache
        - if: has_resp
          exec:
            - _return
        - primary:
            - primary_fast
          secondary:
            - fallback_hagezi
          fast_fallback: 5000
          always_standby: false

# v4.5.3 server configuration.
# The external doh-gateway connects to this plaintext HTTP DoH endpoint.
servers:
  - exec: main_sequence
    timeout: 5
    listeners:
      - protocol: http
        addr: "127.0.0.1:8081"
        url_path: "/dns-query"
        get_user_ip_from_header: "X-Forwarded-For"
        
